[project]
name = "qat-agent-helpers"
version = "0.2.0"
description = "Helpers for AI agents that drive running Qt apps with Qat scripts. Unofficial, community-made. Not affiliated with or endorsed by the Qat project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Petr Mironychev" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "qat==1.9.0",
]

[project.entry-points.pytest11]
qat_agent_helpers = "qat_agent_helpers.pytest_plugin"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
